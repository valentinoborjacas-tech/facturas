<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a4a">
  <meta name="description" content="Caja, ventas, stock y fiados para tu bodega. Funciona sin internet.">
  <title>Bodega Fácil</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div id="app">
    <header class="top">
      <div class="top-name" id="bodegaName">Bodega Fácil</div>
      <button type="button" class="user-chip" id="userChip" aria-label="Cambiar de usuario">👤 <span id="userName">—</span> ▾</button>
      <button type="button" class="icon-btn" id="menuBtn" aria-label="Menú">☰</button>
    </header>

    <main id="view"></main>

    <div id="cartBar" class="cart-bar"></div>

    <nav class="tabbar" aria-label="Navegación principal">
      <button type="button" data-tab="caja" class="active"><span>🏪</span>Caja</button>
      <button type="button" data-tab="gastos"><span>💸</span>Gastos</button>
      <button type="button" data-tab="stock"><span>📦</span>Stock</button>
      <button type="button" data-tab="fiados"><span>📒</span>Fiados</button>
    </nav>
  </div>

  <div id="overlay" class="overlay hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
